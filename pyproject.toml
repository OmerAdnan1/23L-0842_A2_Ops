[project]
name = "visionguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "tensorflow[and-cuda]>=2.21.0",
]

[project.scripts]
visionguard = "visionguard:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
