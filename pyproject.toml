[project]
name = "visionguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.67.1",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "keras-tuner>=1.4.8",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "ruff>=0.17.4",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.8",
    "tensorboard>=2.21.0",
    "tensorflow[and-cuda]>=2.21.0",
]

[project.scripts]
visionguard = "visionguard:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
